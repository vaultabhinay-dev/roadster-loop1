<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roadster Loop</title>
<style>
html,body{margin:0;height:100%;background:#03050c;color:#e8f1ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;color-scheme:dark;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none;text-shadow:0 0 8px #000}
#hud b{display:block;font-size:20px;color:#38e8ff;letter-spacing:0}
#gas{width:110px;height:8px;border:1px solid #38e8ff55;border-radius:4px;margin-top:4px;overflow:hidden}
#gas i{display:block;height:100%;width:100%;background:#38a8ff}
#lights{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:#000a;border-radius:20px}
#lights i{width:22px;height:22px;border-radius:50%;background:#2a1014}
#lights i.red{background:#ff3b4e;box-shadow:0 0 14px #ff3b4e}
#lights i.grn{background:#2cff7a;box-shadow:0 0 18px #2cff7a}
#msg{position:fixed;top:36%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,38px);font-weight:700;color:#ffc83d;text-shadow:0 0 14px #000;pointer-events:none}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#panel .card{pointer-events:auto;background:#050914ee;border:1px solid #38e8ff55;border-radius:14px;padding:18px 22px;max-width:min(420px,88vw);text-align:center;box-shadow:0 0 40px #38e8ff22}
h1{margin:0 0 4px;font-size:32px;letter-spacing:.12em;color:#38e8ff}
.sub{opacity:.75;font-size:14px;margin:4px 0 10px}
.grade{font-size:64px;font-weight:800;line-height:1;color:#ffc83d}
.badge{display:inline-block;background:#ffc83d;color:#000;font-weight:800;font-size:12px;padding:3px 8px;border-radius:10px;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;text-align:left;font-size:14px;margin:10px 0}
.grid span{opacity:.7}.grid b{float:right}
button{font:inherit;font-weight:700;background:#38e8ff;color:#001018;border:0;border-radius:10px;padding:10px 20px;cursor:pointer}
#ctl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
.btn{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:#38e8ff22;border:2px solid #38e8ff88;color:#38e8ff;font-size:30px;display:flex;align-items:center;justify-content:center}
@media (pointer:coarse){#ctl{display:flex}}
footer{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);text-align:center;font-size:11px;opacity:.55;padding:4px;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div>Score<b id="hs">0</b>Rings <span id="hr">0</span> · Flips <span id="hf">0</span></div>
<div style="text-align:right">Speed <span id="hv">0</span> mph<b id="ha">0 ft</b>Gas<div id="gas"><i></i></div></div></div>
<div id="lights"><i></i><i></i><i></i><i></i></div>
<div id="msg"></div>
<div id="panel"></div>
<div id="ctl"><div class="btn" data-k="l">&#9664;</div><div class="btn" data-k="r">&#9654;</div></div>
<footer>Unofficial fan game, not affiliated with Tesla.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const G=32.2,MPH=1.4667,DT=1/120,R1=22,WALL=14,R2=9,SW=22*Math.PI/180,RIDE=1.5,DIST=260;
const LQ=R1*Math.PI/2,L=LQ+WALL+R2*SW;
const $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function pt(s){
  if(s<=0)return{x:s,y:0,tx:1,ty:0,k:0};
  if(s<=LQ){const a=s/R1;return{x:R1*Math.sin(a),y:R1-R1*Math.cos(a),tx:Math.cos(a),ty:Math.sin(a),k:1/R1};}
  if(s<=LQ+WALL)return{x:R1,y:R1+s-LQ,tx:0,ty:1,k:0};
  const t=(s-LQ-WALL)/R2;
  return{x:R1-R2+R2*Math.cos(t),y:R1+WALL+R2*Math.sin(t),tx:-Math.sin(t),ty:Math.cos(t),k:1/R2};
}
/* ---------- three.js scene ---------- */
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03050c);scene.fog=new THREE.FogExp2(0x03050c,0.0028);
const cam=new THREE.PerspectiveCamera(50,1,1,3000);
function resize(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0x3a5a9a,0x05060c,0.9));
const dl=new THREE.DirectionalLight(0x8fb4ff,0.6);dl.position.set(-50,100,80);scene.add(dl);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.3},o||{}));
const B=(c)=>new THREE.MeshBasicMaterial({color:c});
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;}
// ground, road
box(3600,.2,800,M(0x080b14,{roughness:.95}),-800,-.1,0);
box(3600,.2,40,M(0x151a26,{roughness:.8}),-800,0,0);
box(3600,.15,.4,B(0x38e8ff),-800,.1,-20);box(3600,.15,.4,B(0x38e8ff),-800,.1,20);
for(let x=-2400;x<300;x+=24)box(10,.12,.6,B(0xdfe8ff),x,.12,0);
for(let x=-1800;x<=250;x+=100)for(const z of[-26,26]){box(.5,22,.5,M(0x222a3c),x,11,z);box(3,.5,.8,B(0xffd9a0),x,22,z);}
// buildings with windows
const wc=document.createElement('canvas');wc.width=64;wc.height=128;const wx=wc.getContext('2d');
wx.fillStyle='#090d1a';wx.fillRect(0,0,64,128);
for(let i=0;i<110;i++){wx.fillStyle=Math.random()<.7?'#ffd78a':'#5fd6ff';wx.globalAlpha=.4+Math.random()*.6;wx.fillRect((i*7)%60+2,Math.floor(i/9)*10+3,3,4);}
const wt=new THREE.CanvasTexture(wc);
for(let i=0;i<80;i++){const h=30+Math.random()*120,w=20+Math.random()*30;
  box(w,h,20+Math.random()*20,new THREE.MeshBasicMaterial({map:wt}),-2400+Math.random()*2700,h/2,-90-Math.random()*70);}
// stars, moon
{const p=[];for(let i=0;i<600;i++)p.push(-2400+Math.random()*2800,70+Math.random()*500,-520);
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,fog:false})));
const mo=new THREE.Mesh(new THREE.SphereGeometry(22,24,16),new THREE.MeshBasicMaterial({color:0xdfe8ff,fog:false}));mo.position.set(-300,320,-500);scene.add(mo);}
// ramp
{const pos=[],idx=[],lA=[],lB=[];let n=0;
for(let s=0;s<=L+.01;s+=.5){const p=pt(Math.min(s,L));pos.push(p.x,p.y,-12,p.x,p.y,12);lA.push(new THREE.Vector3(p.x,p.y,-12));lB.push(new THREE.Vector3(p.x,p.y,12));
  if(n){const a=(n-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}n++;}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
scene.add(new THREE.Mesh(g,M(0x1a2238,{metalness:.5,roughness:.45,side:THREE.DoubleSide})));
for(const a of[lA,lB])scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(a),new THREE.LineBasicMaterial({color:0x38e8ff})));}
// car (original design "Voltari R1")
const carG=new THREE.Group();scene.add(carG);
{const sh=new THREE.Shape();[[-7,-.7],[7,-.7],[7.2,0],[5,.8],[2.2,1],[.2,2.3],[-3.2,2.4],[-6.2,1],[-7,.6]].forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
const bg=new THREE.ExtrudeGeometry(sh,{depth:5.6,bevelEnabled:false});bg.translate(0,0,-2.8);
carG.add(new THREE.Mesh(bg,M(0x14305e,{metalness:.85,roughness:.22,emissive:0x061428})));
const gl=new THREE.Mesh(new THREE.BoxGeometry(3.4,.9,5.7),M(0x0a0f1a,{metalness:1,roughness:.1}));gl.position.set(-1.4,1.7,0);gl.rotation.z=.15;carG.add(gl);
const hl=new THREE.Mesh(new THREE.BoxGeometry(.2,.25,4.6),B(0x9ff4ff));hl.position.set(7.15,.15,0);carG.add(hl);
const tl=new THREE.Mesh(new THREE.BoxGeometry(.2,.25,4.6),B(0xff3b4e));tl.position.set(-7,.6,0);carG.add(tl);
const ug=new THREE.Mesh(new THREE.BoxGeometry(12,.1,5),B(0x38e8ff));ug.position.y=-.78;carG.add(ug);}
const wheels=[];
for(const x of[-4.6,4.6])for(const z of[-2.9,2.9]){const pv=new THREE.Group();pv.position.set(x,-.4,z);
  const c=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,.9,20),M(0x0a0a0e));c.rotation.x=Math.PI/2;pv.add(c);
  pv.add(new THREE.Mesh(new THREE.BoxGeometry(1.8,.2,.95),M(0x8899aa)));carG.add(pv);wheels.push(pv);}
const plumes=[];
for(const x of[-3,3])for(const z of[-1.6,1.6]){
  const p=new THREE.Mesh(new THREE.ConeGeometry(.6,5,12),new THREE.MeshBasicMaterial({color:0x58b8ff,transparent:true,opacity:.75}));
  p.rotation.z=Math.PI;p.position.set(x,-.75-2.5,z);p.visible=false;carG.add(p);plumes.push(p);}
const carLight=new THREE.PointLight(0x38e8ff,1.2,60);carG.add(carLight);
const CORN=[[-4.6,-1.5],[4.6,-1.5],[7,-.7],[-7,-.7],[.2,2.4],[-3.2,2.4]];
/* ---------- audio ---------- */
let ac;function beep(f,d,t){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.type=t||'square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
/* ---------- state ---------- */
const car={x:-DIST,y:RIDE,vx:0,vy:0,ang:0,w:0};
let st='title',ct=0,greenAt=0,green=false,greenStamp=0,lockUntil=0,resTime=0,stT=0;
let reaction=0,mph=0,v=0,acc=0,s=0,gas=1,airT=0,maxAlt=0,peakG=1,flips=0,inv=false,rings=0,bonus=0,sink=0,score=0,crashed=false,newBest=false;
let ringObjs=[],debris=[],fire=null,shake=0,msgT=0;
const K={l:0,r:0,s:0};
let best=0;try{best=+localStorage.getItem('roadsterLoopBest')||0;}catch(e){}
const lights=[...document.querySelectorAll('#lights i')];
function msg(t,ms){$('msg').textContent=t;clearTimeout(msgT);if(ms)msgT=setTimeout(()=>$('msg').textContent='',ms);}
function calc(){return rings*500+flips*1500+Math.round(maxAlt)+Math.round(airT*100)+bonus;}
function title(){$('panel').innerHTML='<div class="card"><h1>ROADSTER LOOP</h1><div class="sub">Voltari R1 night stunt run</div><div class="sub">Wait for the green light, launch up the ramp, spin with &larr; &rarr;, hold Space for cold-gas thrusters, land upright and soft.</div><div class="sub">Best: '+best+'</div><b style="color:#ffc83d">Press Space / tap to start</b></div>';}
function clearRun(){ringObjs.forEach(r=>scene.remove(r.m));ringObjs=[];debris.forEach(d=>scene.remove(d.m));debris=[];if(fire){scene.remove(fire);fire=null;}}
function startCount(){
  clearRun();Object.assign(car,{x:-DIST,y:RIDE,vx:0,vy:0,ang:0,w:0});carG.visible=true;
  rings=0;flips=0;inv=false;maxAlt=0;airT=0;peakG=1;bonus=0;gas=1;v=0;s=0;crashed=false;newBest=false;sink=0;
  lights.forEach(l=>l.className='');ct=0;green=false;greenAt=3+.8+.7+Math.random()*1.2;
  $('panel').innerHTML='';msg('',0);$('lights').style.display='flex';st='count';
}
function press(){
  const n=performance.now();if(n<lockUntil)return;
  if(st==='title'){startCount();return;}
  if(st==='results'){if(n>resTime+600)startCount();return;}
  if(st==='count'){
    if(!green){lockUntil=n+400;beep(180,.25);msg('Too early, wait for green',900);return;}
    reaction=(n-greenStamp)/1000;mph=cl(90-5*reaction,76,90);v=mph*MPH;acc=v*v/(2*DIST);car.vx=0;st='drive';msg('',0);
  }
}
/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight')e.preventDefault();
  if(e.code==='ArrowLeft')K.l=1;else if(e.code==='ArrowRight')K.r=1;else if(e.code==='Space'){K.s=1;if(!e.repeat)press();}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')K.l=0;else if(e.code==='ArrowRight')K.r=0;else if(e.code==='Space')K.s=0;});
addEventListener('pointerdown',e=>{if(e.target.closest('.btn,button'))return;K.s=1;press();});
addEventListener('pointerup',()=>K.s=0);addEventListener('pointercancel',()=>K.s=0);
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1;});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=0));});
/* ---------- physics (fixed step) ---------- */
function spawnRings(){
  const vy=car.vy,y0=car.y,T=(vy+Math.sqrt(vy*vy+2*G*(y0-RIDE)))/G;
  [.1,.22,.36,.5,.64,.78,.9].forEach(f=>{const t=f*T,m=new THREE.Mesh(new THREE.TorusGeometry(5,.35,12,40),B(0xffc83d));
    const x=car.x+car.vx*t,y=Math.max(8,y0+vy*t-.5*G*t*t);m.position.set(x,y,0);scene.add(m);ringObjs.push({m,x,y,got:false});});
}
function explode(){
  st='crashed';stT=0;crashed=true;carG.visible=false;shake=1.4;beep(90,.5,'sawtooth');
  fire=new THREE.Mesh(new THREE.SphereGeometry(3,16,12),new THREE.MeshBasicMaterial({color:0xff8a2a,transparent:true}));fire.position.set(car.x,Math.max(car.y,2),0);scene.add(fire);
  for(let i=0;i<18;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.6+Math.random()*1.4,.4+Math.random(),.6+Math.random()*1.4),B(i%3?0x14305e:0xff8a2a));
    m.position.set(car.x,Math.max(car.y,2),0);scene.add(m);
    debris.push({m,x:car.x,y:Math.max(car.y,2),z:0,vx:car.vx*.4+(Math.random()-.5)*50,vy:Math.random()*35,vz:(Math.random()-.5)*30,r:Math.random()*8});}
}
function finish(){
  score=calc();newBest=score>best;if(newBest){best=score;try{localStorage.setItem('roadsterLoopBest',String(best));}catch(e){}}
  const g=crashed?'F':score>=9000?'S':score>=6500?'A':score>=4500?'B':score>=2500?'C':'D';
  st='results';resTime=performance.now();msg('',0);
  $('panel').innerHTML='<div class="card"><div class="sub">'+(crashed?'CRASHED':'CLEAN LANDING')+'</div><div class="grade">'+g+'</div><div style="font-size:26px;font-weight:700">'+score+'</div>'+(newBest?'<div class="badge">NEW BEST</div>':'<div class="sub">Best '+best+'</div>')+
  '<div class="grid"><div><span>Reaction</span><b>'+reaction.toFixed(3)+' s</b></div><div><span>Ramp speed</span><b>'+mph.toFixed(1)+' mph</b></div><div><span>Peak G</span><b>'+peakG.toFixed(1)+'</b></div><div><span>Max altitude</span><b>'+Math.round(maxAlt)+' ft</b></div><div><span>Airtime</span><b>'+airT.toFixed(1)+' s</b></div><div><span>Flips</span><b>'+flips+'</b></div><div><span>Rings</span><b>'+rings+'</b></div><div><span>Touchdown</span><b>'+sink.toFixed(1)+' ft/s</b></div></div><button id="again">Run it again</button></div>';
  $('again').onclick=startCount;
}
function step(dt){
  if(st==='drive'){
    v=Math.min(v,mph*MPH);car.vx+=acc*dt;car.x+=car.vx*dt;car.y=RIDE;car.ang=0;
    if(car.x>=0){v=car.vx;s=car.x;st='ramp';$('lights').style.display='none';}
  }else if(st==='ramp'){
    let p=pt(s);v=Math.max(5,v-G*p.ty*dt);s+=v*dt;peakG=Math.max(peakG,v*v*p.k/G+p.tx);
    if(s>=L){p=pt(L);car.vx=v*p.tx;car.vy=v*p.ty;car.ang=Math.atan2(p.ty,p.tx);car.x=p.x-p.ty*RIDE;car.y=p.y+p.tx*RIDE;car.w=.9;
      st='air';airT=0;gas=1;spawnRings();return;}
    car.ang=Math.atan2(p.ty,p.tx);car.x=p.x-p.ty*RIDE;car.y=p.y+p.tx*RIDE;
  }else if(st==='air'){
    airT+=dt;car.w+=(K.l-K.r)*9*dt;car.w*=Math.exp(-.5*dt);car.w=cl(car.w,-6,6);car.ang+=car.w*dt;
    let ax=0,ay=-G;
    if(K.s&&gas>0){ax+=-Math.sin(car.ang)*26;ay+=Math.cos(car.ang)*26;gas=Math.max(0,gas-.28*dt);}
    car.vx+=ax*dt;car.vy+=ay*dt;car.x+=car.vx*dt;car.y+=car.vy*dt;maxAlt=Math.max(maxAlt,car.y-RIDE);
    const up=Math.cos(car.ang);if(up<-.7&&!inv){inv=true;flips++;beep(660,.08,'sine');}if(up>.7)inv=false;
    for(const r of ringObjs)if(!r.got&&Math.hypot(car.x-r.x,car.y-r.y)<6.2){r.got=true;r.m.visible=false;rings++;gas=Math.min(1,gas+.35);beep(880,.1,'sine');}
    let mn=1e9;const c=Math.cos(car.ang),sn=Math.sin(car.ang);
    for(const q of CORN)mn=Math.min(mn,car.y+q[0]*sn+q[1]*c);
    if(mn<=0&&car.vy<0){
      sink=-car.vy;const tilt=Math.acos(cl(Math.cos(car.ang),-1,1))*180/Math.PI;
      if(sink<=39&&tilt<=28){st='landed';stT=0;bonus=1000+Math.round((39-sink)*25);car.vy=0;car.y=RIDE;
        car.ang=Math.atan2(Math.sin(car.ang),Math.cos(car.ang));shake=.3;beep(300,.15,'sine');msg('Soft landing!',1500);}
      else{explode();}
    }
  }else if(st==='landed'){
    stT+=dt;const d=Math.sign(car.vx)*30*dt;car.vx=Math.abs(car.vx)<=Math.abs(d)?0:car.vx-d;car.x+=car.vx*dt;
    car.ang+=(0-car.ang)*Math.min(1,10*dt);car.y=RIDE;if(stT>2.2)finish();
  }else if(st==='crashed'){
    stT+=dt;if(stT>2.4)finish();
  }
  // debris & fire
  for(const d of debris){d.vy-=G*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;if(d.y<.3){d.y=.3;d.vy*=-.4;d.vx*=.7;d.vz*=.7;}d.m.position.set(d.x,d.y,d.z);d.m.rotation.x+=d.r*dt;d.m.rotation.z+=d.r*dt;}
  if(fire){const k=Math.min(stT/1.2,1);fire.scale.setScalar(1+k*5);fire.material.opacity=1-k;}
  shake*=Math.exp(-3*dt);
}
/* ---------- frame ---------- */
let last=performance.now(),acm=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.25);last=now;
  if(st==='count'){
    ct+=dt;lights.forEach((l,i)=>{if(ct>.6+.8*i&&l.className!=='grn')l.className='red';});
    if(!green&&ct>=greenAt){green=true;greenStamp=performance.now();lights[3].className='grn';beep(900,.15,'sine');msg('GO!',700);}
  }
  acm+=dt;while(acm>=DT){step(DT);acm-=DT;}
  // visuals
  carG.position.set(car.x,car.y,0);carG.rotation.z=car.ang;
  const spd=st==='drive'?car.vx:st==='ramp'?v:Math.abs(car.vx);
  wheels.forEach(w=>w.rotation.z-=spd/1.1*dt*(st==='air'?0:1));
  const th=st==='air'&&K.s&&gas>0;plumes.forEach(p=>{p.visible=th;if(th)p.scale.set(1,.8+Math.random()*.5,1);});
  const alt=Math.max(0,car.y-RIDE),air=st==='air'||st==='landed'||st==='crashed';
  let tx,ty,tz;
  if(st==='title'||st==='count'){tx=-120;ty=22;tz=130;}
  else if(air){tx=car.x;ty=Math.max(car.y*.78,14);tz=50+alt*.3;}
  else{tx=car.x+20;ty=Math.max(car.y*.6,14);tz=70;}
  const k=1-Math.exp(-5*dt);
  cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(ty-cam.position.y)*k;cam.position.z+=(tz-cam.position.z)*k;
  cam.lookAt(cam.position.x+shake*(Math.random()-.5)*6,cam.position.y+shake*(Math.random()-.5)*6,0);
  ren.render(scene,cam);
